<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><B style=""><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #800000;">炼金大师</SPAN></B></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">你学习了炼金术的奥秘，并长于其实践，这提供了下述的好处：</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">· 你的智力值加<SPAN lang=EN-US>1</SPAN>，上限为<SPAN lang=EN-US>20</SPAN>。</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">· 你得到炼金术士设备的熟练。若你已经对其具有熟练，你在使用它进行的检定时，将熟练加值的两倍加到检定中。</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">· 你可以立即鉴定一瓶你可以看到的药水。
</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">
· 你可以把制作一瓶任意稀有度的魔法药水作为你长休的一部分，而不再需要花费更多的时间。
</SPAN></DIV> 
 <DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><B style=""><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #800000;">奇物专家</SPAN></B></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">你对魔法物品使用魔法物品更加得心应手。对你来说魔法物品易于同调，你使用魔法物品也更为轻松。你获得以下增益：</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">· 你可以额外同调一个魔法物品。</SPAN></DIV>
<DIV 
style="MARGIN: 3pt 0cm; LINE-HEIGHT: 16pt;"><SPAN 
style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, Helvetica, sans-serif; COLOR: #333333;">· 在你使用魔法物品时，若你需要进行相关检定，则你在那些检定中具有优势。</SPAN></DIV></body>
