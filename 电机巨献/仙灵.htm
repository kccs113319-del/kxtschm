<p><STRONG><FONT color=#800000>妖精一闪</FONT></STRONG><BR><EM>先决条件：仙灵</EM><BR>仙灵的妖精力量使你更加神出鬼没。你获得如下增益</p>

<p><STRONG><FONT color=#800000>童话法术</FONT></STRONG><BR><EM>先决条件：仙灵</EM><BR>仙灵在妖精荒野如童话一般生活，妖精荒野的魔法力量注入他们体内，从而使他们拥有了更加美妙的魔法。</p>
